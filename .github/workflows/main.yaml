name: main

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_VERSION: 10.0.x
  CONFIGURATION: Release

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows x64
            verify_package: false
          - os: windows-11-arm
            name: Windows ARM64
            verify_package: false
          - os: ubuntu-24.04
            name: Linux x64
            verify_package: true
          - os: ubuntu-24.04-arm
            name: Linux ARM64
            verify_package: false
          - os: macos-15-intel
            name: macOS x64
            verify_package: false
          - os: macos-15
            name: macOS ARM64
            verify_package: false
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore
        run: dotnet restore Icod.Host.sln
      - name: Build
        run: dotnet build Icod.Host.sln -c ${{ env.CONFIGURATION }} --no-restore -p:ContinuousIntegrationBuild=true
      - name: Test
        run: dotnet test Icod.Host.sln -c ${{ env.CONFIGURATION }} --no-build --no-restore --logger trx
      - name: Pack Release package
        if: matrix.verify_package
        run: dotnet pack Icod.Host.csproj -c ${{ env.CONFIGURATION }} --no-build --no-restore -o artifacts -p:ContinuousIntegrationBuild=true
      - name: Verify exact Release package artifacts
        if: matrix.verify_package
        shell: pwsh
        run: ./packaging/VerifyPackageArtifact.ps1 -ArtifactDirectory artifacts -Configuration '${{ env.CONFIGURATION }}'
      - name: Upload validated Release package artifacts
        if: matrix.verify_package
        uses: actions/upload-artifact@v4
        with:
          name: icod-host-main-packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error
          retention-days: 7

name: release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: 10.0.x
  CONFIGURATION: Release

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Require tagged commit on main
        shell: pwsh
        run: |
          git fetch origin main --no-tags
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if (0 -ne $LASTEXITCODE) {
              throw "Release tag '$env:GITHUB_REF_NAME' is not contained in main."
          }
      - id: version
        name: Validate tag and package version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v(?<version>[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z][0-9A-Za-z.-]*)?)$') {
              throw "Release tag '$env:GITHUB_REF_NAME' is not a supported v<semver> tag."
          }
          $version = $Matches.version
          $projectVersion = (dotnet msbuild Icod.Host.csproj -nologo -getProperty:PackageVersion).Trim()
          if ($version -ne $projectVersion) {
              throw "Tag version '$version' does not match PackageVersion '$projectVersion'."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$($version.Contains('-').ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

  package:
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore
        run: dotnet restore Icod.Host.sln
      - name: Build
        run: dotnet build Icod.Host.sln -c ${{ env.CONFIGURATION }} --no-restore -p:ContinuousIntegrationBuild=true
      - name: Test
        run: dotnet test Icod.Host.sln -c ${{ env.CONFIGURATION }} --no-build --no-restore --logger trx
      - name: Pack
        run: dotnet pack Icod.Host.csproj -c ${{ env.CONFIGURATION }} --no-build --no-restore -o artifacts/release -p:ContinuousIntegrationBuild=true
      - name: Select tag-matching package
        shell: pwsh
        run: ./packaging/SelectReleasePackages.ps1 -SourceDirectory artifacts/release -DestinationDirectory artifacts/selected -ExpectedVersion '${{ needs.metadata.outputs.version }}'
      - name: Verify exact Release package artifacts
        shell: pwsh
        run: ./packaging/VerifyPackageArtifact.ps1 -ArtifactDirectory artifacts/selected -Configuration '${{ env.CONFIGURATION }}' -ExpectedVersion '${{ needs.metadata.outputs.version }}'
      - name: Upload exact Release package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: icod-host-release-packages
          path: |
            artifacts/selected/*.nupkg
            artifacts/selected/*.snupkg
          if-no-files-found: error
          retention-days: 7

  publish-nuget:
    needs: [metadata, package]
    runs-on: ubuntu-latest
    environment: Release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: icod-host-release-packages
          path: artifacts/package
      - name: Exchange GitHub OIDC token for NuGet credential
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish to NuGet.org
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          Get-ChildItem artifacts/package -Filter '*.nupkg' -File |
            Where-Object { -not $_.Name.EndsWith('.symbols.nupkg') } |
            ForEach-Object {
              dotnet nuget push $_.FullName --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
              if (0 -ne $LASTEXITCODE) { throw "NuGet.org publication failed for '$($_.Name)'." }
            }

  publish-github-packages:
    needs: [metadata, package]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: icod-host-release-packages
          path: artifacts/package
      - name: Publish to GitHub Packages
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNER: ${{ github.repository_owner }}
        run: |
          $source = "https://nuget.pkg.github.com/$env:GITHUB_OWNER/index.json"
          Get-ChildItem artifacts/package -Filter '*.nupkg' -File |
            Where-Object { -not $_.Name.EndsWith('.symbols.nupkg') } |
            ForEach-Object {
              dotnet nuget push $_.FullName --api-key $env:GITHUB_TOKEN --source $source --skip-duplicate
              if (0 -ne $LASTEXITCODE) { throw "GitHub Packages publication failed for '$($_.Name)'." }
            }

  github-release:
    needs: [metadata, package, publish-nuget, publish-github-packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: icod-host-release-packages
          path: artifacts/release-assets
      - name: Create checksums
        shell: pwsh
        run: |
          $files = @(Get-ChildItem artifacts/release-assets -File | Sort-Object Name)
          if (2 -ne $files.Count) { throw "Expected exactly two package assets before checksums; found $($files.Count)." }
          $lines = foreach ($file in $files) {
              $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($file.Name)"
          }
          [System.IO.File]::WriteAllLines('artifacts/release-assets/SHA256SUMS.txt', $lines, [System.Text.UTF8Encoding]::new($false))
      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          $arguments = @('release','create',$env:GITHUB_REF_NAME,'--verify-tag','--title',"Icod.Host ${{ needs.metadata.outputs.version }}",'--generate-notes')
          if ('true' -eq '${{ needs.metadata.outputs.prerelease }}') {
              $arguments += '--prerelease'
              $arguments += '--latest=false'
          }
          $arguments += @(Get-ChildItem artifacts/release-assets -File | Sort-Object Name | ForEach-Object { $_.FullName })
          & gh @arguments
          if (0 -ne $LASTEXITCODE) { throw 'GitHub Release creation failed.' }
